<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#B9A7EA">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>위포드 월간 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Gothic+A1:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FAF8FD; --surface:#FFFFFF; --surface-2:#F4F1FB; --surface-3:#E9E3F6;
  --ink:#1A1720; --ink-2:#615A70; --ink-3:#948CA6;
  --line:#E3DCF1; --line-2:#EEE9F8;
  --lilac:#B9A7EA; --lilac-soft:#EFEAFC; --lilac-line:#D6C9F3;
  --violet:#6E5AAE; --violet-deep:#402F72;
  --amber:#B8811F; --amber-soft:#F7EED8;
  --rose:#AF4762; --rose-soft:#F8E2E8;
  --on-violet:#FFFFFF;
  --shadow:0 1px 2px rgba(40,26,72,.05), 0 10px 28px -14px rgba(40,26,72,.22);
  --shadow-lift:0 2px 4px rgba(40,26,72,.07), 0 20px 44px -20px rgba(40,26,72,.34);
  --display:"Archivo","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sans:"Gothic A1","Archivo","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131019; --surface:#1C1826; --surface-2:#241F30; --surface-3:#2E2740;
    --ink:#EDE9F6; --ink-2:#ABA2BE; --ink-3:#7A7291;
    --line:#332B47; --line-2:#2A2439;
    --lilac:#C5B3F2; --lilac-soft:#291F44; --lilac-line:#3D3163;
    --violet:#B9A5EF; --violet-deep:#D4C6FA;
    --amber:#D6A84E; --amber-soft:#382D16;
    --rose:#DE7E95; --rose-soft:#3A2029;
    --on-violet:#151020;
    --shadow:0 1px 2px rgba(0,0,0,.34), 0 10px 28px -14px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.4), 0 20px 44px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#131019; --surface:#1C1826; --surface-2:#241F30; --surface-3:#2E2740;
  --ink:#EDE9F6; --ink-2:#ABA2BE; --ink-3:#7A7291;
  --line:#332B47; --line-2:#2A2439;
  --lilac:#C5B3F2; --lilac-soft:#291F44; --lilac-line:#3D3163;
  --violet:#B9A5EF; --violet-deep:#D4C6FA;
  --amber:#D6A84E; --amber-soft:#382D16;
  --rose:#DE7E95; --rose-soft:#3A2029;
  --on-violet:#151020;
  --shadow:0 1px 2px rgba(0,0,0,.34), 0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.4), 0 20px 44px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.68;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.32}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--violet); outline-offset:2px; border-radius:5px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.wrap{max-width:600px; margin:0 auto; padding:0 16px}

/* ---------- 로고 잠금 ---------- */
.mark{
  font-family:var(--display); font-weight:800; letter-spacing:-.045em;
  font-stretch:100%; line-height:1; color:var(--ink);
}
.logo{display:block; width:auto; max-width:100%; height:auto}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo{filter:invert(1)} }
:root[data-theme="dark"] .logo{filter:invert(1)}
@media print{ .logo{filter:none} }

.tagline{
  font-family:var(--display); font-weight:400; font-size:9px;
  letter-spacing:.24em; text-transform:uppercase; color:var(--ink-3);
  white-space:nowrap;
}

/* ---------- 상단바 ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(1.5) blur(12px);
  border-bottom:1px solid var(--line-2);
}
.topbar-in{max-width:600px; margin:0 auto; padding:9px 16px; display:flex; align-items:center; gap:11px}
.brand{display:flex; flex-direction:column; gap:2px; min-width:0}
.brand .mark{font-size:19px}
.brand #brandMark{display:block; line-height:0}
.brand .sub{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--lilac); font-weight:600; font-family:var(--display)}
.topbar .spacer{flex:1}

/* ---------- 버튼 ---------- */
.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:8px 13px; font-size:13.5px; font-weight:500;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  transition:background .15s, border-color .15s;
}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--violet); border-color:var(--violet); color:var(--on-violet); font-weight:600}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn-sm{padding:5px 10px; font-size:12.5px; border-radius:8px}
.btn-danger{color:var(--rose); border-color:transparent; background:transparent}
.btn-danger:hover{background:var(--rose-soft)}
.btn-block{width:100%}

/* ---------- 공통 ---------- */
.eyebrow{font-family:var(--display); font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--violet)}
.section{margin-top:26px}
.section-head{display:flex; align-items:center; gap:10px; margin-bottom:11px}
.section-head h2{font-size:15px; font-weight:700; letter-spacing:-.01em}
.section-head .spacer{flex:1}
.dim{color:var(--ink-3)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:12px; font-weight:600; color:var(--ink-2)}
.input, textarea.input{
  width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:10px; padding:9px 11px; font-size:14.5px; line-height:1.55;
  transition:border-color .15s, box-shadow .15s;
}
.input:focus{outline:none; border-color:var(--lilac); box-shadow:0 0 0 3px var(--lilac-soft)}
textarea.input{resize:vertical; min-height:88px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}

/* ---------- 홈 ---------- */
.hero{padding:30px 0 4px}
.hero .mark{font-size:44px; display:block}
.hero .tagline{margin-top:9px; display:block}
.hero h1{margin-top:20px; font-size:23px; font-weight:700; letter-spacing:-.02em}
.hero p{margin-top:9px; color:var(--ink-2); font-size:14.5px; max-width:44ch}

.rowlist{display:flex; flex-direction:column; gap:8px}
.rowcard{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line-2); border-radius:14px;
  padding:13px 14px; transition:border-color .15s, transform .12s, box-shadow .15s;
}
.rowcard:hover{border-color:var(--lilac-line); box-shadow:var(--shadow); transform:translateY(-1px)}
.avatar{
  width:38px; height:38px; flex:none; border-radius:12px;
  background:var(--lilac-soft); color:var(--violet);
  display:grid; place-items:center; font-weight:700; font-size:15px; font-family:var(--display);
}
.rowcard .meta{flex:1; min-width:0}
.rowcard .meta strong{display:flex; align-items:center; gap:6px; font-size:15px; font-weight:700; letter-spacing:-.01em}
.rowcard .meta span{display:block; font-size:12.5px; color:var(--ink-3); margin-top:1px}
.pct{font-family:var(--mono); font-size:14px; font-weight:600; color:var(--violet); font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--line); border-radius:14px; padding:26px 20px; text-align:center; color:var(--ink-3); font-size:14px}

/* ---------- 리포트 문서 ---------- */
.doc{background:var(--surface); border:1px solid var(--line-2); border-radius:20px; overflow:hidden; box-shadow:var(--shadow)}
.doc-cover{
  padding:26px 22px 24px;
  background:
    radial-gradient(130% 100% at 88% 0%, var(--lilac-soft) 0%, transparent 66%),
    linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
  border-bottom:1px solid var(--line-2);
}
.cover-top{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:24px}
.cover-top .mark{font-size:20px}
.cover-top .tagline{margin-top:5px; font-size:8px; letter-spacing:.2em}
.cover-period{font-family:var(--mono); font-size:11px; color:var(--ink-2); letter-spacing:.02em; white-space:nowrap; text-align:right; padding-top:3px}
.cover-title{font-size:29px; font-weight:800; letter-spacing:-.03em; line-height:1.24; margin-top:8px}
.cover-title em{font-style:normal; color:var(--violet)}
.cover-sub{margin-top:8px; font-size:13.5px; color:var(--ink-2)}
.cover-rule{height:1px; background:var(--line); margin:19px 0 15px}
.cover-greet{font-size:14px; line-height:1.8; color:var(--ink-2); white-space:pre-wrap}

.doc-body{padding:2px 20px 22px}
.blk{padding:21px 0; border-bottom:1px solid var(--line-2)}
.blk:last-child{border-bottom:none}
.blk-head{display:flex; align-items:center; gap:9px; margin-bottom:12px}
.blk-head h3{font-size:15.5px; font-weight:700; letter-spacing:-.01em}
.blk-kind{
  font-family:var(--display); font-size:9.5px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--violet); background:var(--lilac-soft);
  padding:3px 7px; border-radius:6px; white-space:nowrap;
}
.blk-text{font-size:14.5px; line-height:1.85; color:var(--ink-2); white-space:pre-wrap}
.blk-link{
  display:inline-flex; align-items:center; gap:6px; font-size:14px; color:var(--violet);
  text-decoration:none; border-bottom:1px solid var(--lilac-line); padding-bottom:1px; word-break:break-all;
}
.blk-link:hover{border-bottom-color:var(--violet)}

/* ---------- 출석 ---------- */
.att-summary{display:flex; align-items:flex-end; gap:16px; margin-bottom:16px; flex-wrap:wrap}
.att-big{font-family:var(--mono); font-size:40px; font-weight:600; line-height:1; letter-spacing:-.04em; color:var(--violet)}
.att-big span{font-size:17px; margin-left:1px; color:var(--ink-3)}
.att-legend{display:flex; flex-wrap:wrap; gap:4px 14px; padding-bottom:5px}
.lg{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink-2)}
.dot{width:9px; height:9px; border-radius:3px; flex:none}
.dot.p{background:var(--violet)}
.dot.l{background:var(--amber)}
.dot.a{background:var(--rose)}
.lg b{font-family:var(--mono); font-weight:600; color:var(--ink)}

.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.cal-h{text-align:center; font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--ink-3); padding-bottom:5px}
.cal-h.sun{color:var(--rose)}
.cell{
  aspect-ratio:1/1; border-radius:9px; display:grid; place-items:center;
  font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums;
  background:var(--surface-2); color:var(--ink-3); border:1px solid transparent;
  transition:transform .1s, background .15s; padding:0;
}
.cell.void{background:transparent}
.cell.p{background:var(--violet); color:var(--on-violet); font-weight:600}
.cell.l{background:var(--amber-soft); color:var(--amber); font-weight:600; border-color:var(--amber)}
.cell.a{background:var(--rose-soft); color:var(--rose); font-weight:600; border-color:var(--rose)}
button.cell{cursor:pointer}
button.cell:hover{transform:scale(1.08)}
.cal-hint{margin-top:10px; font-size:12px; color:var(--ink-3)}
.cal-hint b{color:var(--ink-2)}

/* ---------- 실력 게이지 ---------- */
.gauge-top{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:11px 13px; background:var(--lilac-soft); border-radius:12px; margin-bottom:15px;
}
.gauge-top .lab{font-size:12.5px; color:var(--ink-2)}
.gauge-top .val{font-family:var(--mono); font-size:15px; font-weight:600; color:var(--violet)}
.skills{display:flex; flex-direction:column; gap:12px}
.skill{display:grid; grid-template-columns:1fr auto; gap:5px 10px; align-items:center}
.skill-name{font-size:14px; font-weight:600}
.skill-grade{font-size:12px; font-weight:700; text-align:right; white-space:nowrap}
.skill-grade.hi{color:var(--violet)}
.skill-grade.mid{color:var(--ink-3)}
.skill-grade.lo{color:var(--amber)}
.pips{grid-column:1/-1; display:grid; grid-template-columns:repeat(5,1fr); gap:4px}
.pip{height:9px; border-radius:3px; background:var(--surface-3); border:none; padding:0}
.pip.on.hi{background:var(--violet)}
.pip.on.mid{background:var(--lilac)}
.pip.on.lo{background:var(--amber)}
button.pip{height:24px; cursor:pointer}
button.pip:hover{filter:brightness(.94)}

/* ---------- 편집 ---------- */
.card{background:var(--surface); border:1px solid var(--line-2); border-radius:14px; padding:16px}
.blk-edit{background:var(--surface); border:1px solid var(--line-2); border-radius:14px; padding:14px}
.blk-edit + .blk-edit{margin-top:10px}
.blk-edit-head{display:flex; align-items:center; gap:8px; margin-bottom:11px}
.blk-edit-head .kind{
  font-family:var(--display); font-size:9.5px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--violet); background:var(--lilac-soft); padding:4px 8px; border-radius:6px;
}
.blk-edit-head .spacer{flex:1}
.iconbtn{border:none; background:transparent; color:var(--ink-3); padding:4px 7px; border-radius:7px; font-size:13px; line-height:1}
.iconbtn:hover{background:var(--surface-2); color:var(--ink)}
.iconbtn:disabled{opacity:.28; cursor:default}
.iconbtn:disabled:hover{background:transparent}

.typemenu{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
.typebtn{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 12px; transition:border-color .15s, background .15s}
.typebtn:hover{border-color:var(--lilac); background:var(--lilac-soft)}
.typebtn strong{display:block; font-size:13.5px; font-weight:700}
.typebtn span{display:block; font-size:11.5px; color:var(--ink-3); margin-top:2px; line-height:1.45}

.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; align-items:center}
.chips .cl{font-size:11.5px; color:var(--ink-3); margin-right:2px}
.chip{
  border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:4px 11px; font-size:12.5px; font-weight:600; color:var(--ink-2);
  transition:border-color .15s, background .15s, color .15s;
}
.chip:hover{border-color:var(--lilac); background:var(--lilac-soft); color:var(--violet)}
.chip.on,.chip.on:hover{background:var(--violet); border-color:var(--violet); color:var(--on-violet)}
.metabtn{background:transparent; border:none; text-align:left; flex:1; min-width:0; padding:0; font:inherit}
.addrow{display:flex; gap:8px; margin-top:11px}
.addrow .input{flex:1}

.quickadd{display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--lilac-soft); border-radius:12px; padding:11px 13px; margin-top:12px}
.quickadd .t{font-size:12.5px; color:var(--violet); font-weight:600}
.stepper{display:flex; align-items:center; gap:2px; background:var(--surface); border-radius:9px; padding:2px; border:1px solid var(--line)}
.stepper button{border:none; background:transparent; width:26px; height:26px; border-radius:7px; font-size:15px; line-height:1; color:var(--ink-2)}
.stepper button:hover{background:var(--surface-2); color:var(--ink)}
.stepper .n{font-family:var(--mono); font-size:14px; font-weight:600; width:22px; text-align:center}

.sticky-actions{
  position:sticky; bottom:0; z-index:15; margin:22px -16px 0; padding:12px 16px 16px;
  background:linear-gradient(180deg, transparent 0%, var(--bg) 34%); display:flex; gap:8px;
}
.sticky-actions .btn{padding:11px 14px; font-size:14.5px}
.sticky-actions .btn-primary{flex:1}

/* ---------- 공유 ---------- */
.share-card{background:var(--surface); border:1px solid var(--lilac-line); border-radius:14px; padding:16px; margin-bottom:16px}
.linkbox{
  font-family:var(--mono); font-size:11.5px; color:var(--ink-2); background:var(--surface-2);
  border-radius:10px; padding:10px 11px; word-break:break-all; max-height:74px; overflow:auto;
  line-height:1.5; border:1px solid var(--line-2);
}
.steps{counter-reset:s; display:flex; flex-direction:column; gap:9px; margin:13px 0 0; padding:0}
.steps li{counter-increment:s; list-style:none; display:flex; gap:10px; font-size:13.5px; color:var(--ink-2); line-height:1.6}
.steps li::before{
  content:counter(s); flex:none; width:20px; height:20px; border-radius:6px;
  background:var(--violet); color:var(--on-violet); font-family:var(--mono);
  font-size:11px; font-weight:600; display:grid; place-items:center; margin-top:3px;
}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px);
  background:var(--ink); color:var(--bg); padding:10px 17px; border-radius:999px;
  font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lift); z-index:60;
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; max-width:90vw; text-align:center;
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

/* ---------- 로그인 · 계정 ---------- */
.authwrap{max-width:400px; margin:0 auto; padding:34px 0 0}
.linkbtn{
  background:none; border:none; padding:0; font:inherit; font-size:13px; font-weight:600;
  color:var(--violet); text-decoration:underline; text-underline-offset:3px;
}
.linkbtn:hover{color:var(--ink)}
.authmsg{margin-top:13px; font-size:12.5px; line-height:1.6; padding:9px 11px; border-radius:9px}
.authmsg.ok{background:var(--lilac-soft); color:var(--violet)}
.authmsg.bad{background:var(--rose-soft); color:var(--rose)}

.strip{
  display:flex; align-items:center; gap:10px; padding:10px 13px;
  border-radius:12px; font-size:12.5px; line-height:1.5; margin-top:18px;
}
.strip.ok{background:var(--lilac-soft); color:var(--violet)}
.strip.warn{background:var(--amber-soft); color:var(--amber)}
.sdot{width:7px; height:7px; border-radius:50%; background:var(--violet); flex:none}
#topActions{display:flex; align-items:center; gap:9px}
.syncdot{font-size:11.5px; color:var(--ink-3); white-space:nowrap}

.footnote{text-align:center; padding:28px 0 44px; color:var(--ink-3); font-size:12px; line-height:1.7}
.footnote .mark{font-size:15px; color:var(--ink-2)}
.footnote .tagline{margin-top:6px; display:block}
.footnote p{margin-top:9px}

.samplebadge{
  display:inline-block; font-family:var(--display); font-size:9.5px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; color:var(--violet); background:var(--lilac-soft);
  padding:2px 6px; border-radius:5px; flex:none;
}

@media print{
  .topbar,.sticky-actions,.share-card,.footnote,.btn{display:none!important}
  body{background:#fff}
  .doc{box-shadow:none; border-color:#ddd}
}
</style>

</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span id="brandMark" class="mark">WE4D</span>
      <span class="sub" id="brandName">위포드</span>
    </div>
    <div class="spacer"></div>
    <div id="topActions"></div>
  </div>
</div>

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>

}

function attStats(r){
  var p=0,l=0,a=0;
  for(var k in r.att){ var v=r.att[k]; if(v==="p")p++; else if(v==="l")l++; else if(v==="a")a++; }
  var total=p+l+a;
  return {p:p,l:l,a:a,total:total,rate: total ? Math.round(p/total*100) : 0};
}
function gradeClass(lv){ return lv>=4 ? "hi" : (lv===3 ? "mid" : "lo"); }
function skillAvg(r){
  if(!r.skills.length) return 0;
  var s=0; r.skills.forEach(function(x){ s+=x.level; });
  return Math.round(s/r.skills.length*10)/10;
}

/* ---------- 링크 인코딩 ---------- */
function toB64url(bytes){
  var s="", CH=0x8000;
  for(var i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function fromB64url(str){
  var s=str.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4) s+="=";
  var bin=atob(s), out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function packPayload(r){
  return {a:academy, r:{s:r.student, w:r.teacher, y:r.y, m:r.m, g:r.greeting, t:r.att, k:r.skills, b:r.blocks}};
}
function unpackPayload(o){
  if(!o || !o.r) return null;
  return {
    academy: Object.assign(defaultAcademy(), o.a||{}),
    report:{id:"shared", student:o.r.s||{name:"",klass:""}, teacher:o.r.w||"", y:o.r.y, m:o.r.m,
            greeting:o.r.g||"", att:o.r.t||{}, skills:o.r.k||[], blocks:o.r.b||[]}
  };
}
function encodeReport(r){
  var bytes = new TextEncoder().encode(JSON.stringify(packPayload(r)));
  if(typeof CompressionStream === "function"){
    try{
      var cs = new CompressionStream("deflate-raw");
      var w = cs.writable.getWriter(); w.write(bytes); w.close();
      return new Response(cs.readable).arrayBuffer().then(function(buf){
        return "z=" + toB64url(new Uint8Array(buf));
      });
    }catch(e){}
  }
  return Promise.resolve("r=" + toB64url(bytes));
}
function decodeHash(hash){
  var m = /^#(z|r)=(.+)$/.exec(hash||"");
  if(!m) return Promise.resolve(null);
  var bytes;
  try{ bytes = fromB64url(m[2]); }catch(e){ return Promise.resolve(null); }
  function parse(u8){
    try{ return unpackPayload(JSON.parse(new TextDecoder().decode(u8))); }catch(e){ return null; }
  }
  if(m[1]==="r") return Promise.resolve(parse(bytes));
  if(typeof DecompressionStream !== "function") return Promise.resolve(null);
  try{
    var ds = new DecompressionStream("deflate-raw");
    var w = ds.writable.getWriter(); w.write(bytes); w.close();
    return new Response(ds.readable).arrayBuffer()
      .then(function(buf){ return parse(new Uint8Array(buf)); })
      .catch(function(){ return null; });
  }catch(e){ return Promise.resolve(null); }
}

function renderCalendar(r, editable){
  var first = new Date(r.y, r.m-1, 1).getDay();
  var days = new Date(r.y, r.m, 0).getDate();
  var h = "";
  for(var w=0;w<7;w++) h += '<div class="cal-h'+(w===0?" sun":"")+'">'+WEEK[w]+'</div>';
  for(var i=0;i<first;i++) h += '<div class="cell void"></div>';
  for(var d=1; d<=days; d++){
    var st = r.att[d] || "";
    h += editable
      ? '<button type="button" class="cell '+st+'" data-day="'+d+'" aria-label="'+r.m+'월 '+d+'일 '+(STATUS[st]||"수업 없음")+'">'+d+'</button>'
      : '<div class="cell '+st+'">'+d+'</div>';
  }
  return '<div class="cal">'+h+'</div>';
}

function skillsInner(r, editable){
  var rows = r.skills.map(function(sk){
    var cls = gradeClass(sk.level), pips = "";
    for(var i=1;i<=5;i++){
      pips += editable
        ? '<button type="button" class="pip'+(i<=sk.level?" on "+cls:"")+'" data-skill="'+sk.id+'" data-lv="'+i+'" aria-label="'+esc(sk.name||"과목")+' '+GRADES[i]+'"></button>'
        : '<div class="pip'+(i<=sk.level?" on "+cls:"")+'"></div>';
    }
    var left = editable
      ? '<input class="input" style="padding:6px 10px;font-size:13.5px" value="'+esc(sk.name)+'" data-skillname="'+sk.id+'" placeholder="레슨 과목">'
      : '<div class="skill-name">'+esc(sk.name)+'</div>';
    var right = editable
      ? '<button type="button" class="iconbtn" data-skilldel="'+sk.id+'" aria-label="삭제">✕</button>'
      : '<div class="skill-grade '+cls+'">'+GRADES[sk.level]+'</div>';
    return '<div class="skill">'+left+right+'<div class="pips">'+pips+'</div></div>';
  }).join("");

  return (r.skills.length
      ? '<div class="gauge-top"><span class="lab">평가 과목 '+r.skills.length+'개</span>'
        + '<span class="val">평균 '+skillAvg(r).toFixed(1)+' / 5.0</span></div>'
      : '')
    + (rows ? '<div class="skills">'+rows+'</div>' : '<div class="empty" style="padding:18px">평가할 레슨 과목을 추가해 주세요.</div>')
    + (editable
        ? '<button type="button" class="btn btn-sm btn-block" style="margin-top:13px" data-act="addskill">＋ 빈 과목 추가</button>'
          + subjectChips("addskillname")
        : '');
}

function subjectChips(attr){
  var list = (academy.subjects||[]).filter(function(s){ return s && s.trim(); });
  if(!list.length) return '';
  return '<div class="chips"><span class="cl">빠른 추가</span>'
    + list.map(function(s){
        return '<button type="button" class="chip" data-'+attr+'="'+esc(s)+'">'+esc(s)+'</button>';
      }).join("")
    + '</div>';
}

var LOGO_OK = LOGO.slice(0,5) === "data:";

function markHTML(ac, size){
  var alt = esc(ac.mark || "WE4D");
  return LOGO_OK
    ? '<img class="logo" src="'+LOGO+'" alt="'+alt+'" style="height:'+Math.round(size*0.78)+'px">'
    : '<span class="mark" style="font-size:'+size+'px">'+alt+'</span>';
}

function lockup(ac, size){
  return '<div>'+markHTML(ac, size)
    + (ac.tagline ? '<span class="tagline" style="display:block;margin-top:'+(size>30?8:5)+'px">'+esc(ac.tagline)+'</span>' : '')
    + '</div>';
}

function renderDoc(ac, r){
  var mm = String(r.m).padStart(2,"0");
  var days = new Date(r.y, r.m, 0).getDate();
  var tn = r.teacher || ac.teacher || "";
  return '<article class="doc">'
  + '<header class="doc-cover">'
  +   '<div class="cover-top">'+lockup(ac,20)
  +     '<div class="cover-period">'+r.y+'.'+mm+'.01<br>– '+r.y+'.'+mm+'.'+days+'</div></div>'
  +   '<div class="eyebrow">'+r.y+'년 '+r.m+'월 학습 리포트</div>'
  +   '<h1 class="cover-title"><em>'+esc(r.student.name||"학생")+'</em> 학생</h1>'
  +   '<div class="cover-sub">'+esc(r.student.klass||"")
  +     (tn ? (r.student.klass?' · ':'')+'담당 '+esc(tn)+' 트레이너' : '')+'</div>'
  +   (r.greeting ? '<div class="cover-rule"></div><div class="cover-greet">'+esc(r.greeting)+'</div>' : '')
  + '</header>'
  + '<div class="doc-body">'
  +   '<div class="blk"><div class="blk-head"><h3>'+r.m+'월 출석 현황</h3><span class="blk-kind">Attendance</span></div>'
  +     attendanceInner(r,false)+'</div>'
  +   (r.skills.length ? '<div class="blk"><div class="blk-head"><h3>실력 평가</h3><span class="blk-kind">5-Level</span></div>'
  +     skillsInner(r,false)+'</div>' : '')
  +   r.blocks.map(renderBlockView).join("")
  + '</div></article>';
}

/* ---------- 화면 ---------- */
function monthLabel(){ var n=new Date(); return (n.getMonth()+1)+"월"; }

function renderHome(){
  var slist = students.map(function(s){
    var subs = (s.subjects||[]).length;
    return '<div class="rowcard">'
      + '<span class="avatar">'+esc((s.name||"?").slice(0,1))+'</span>'
      + '<button type="button" class="metabtn" data-student="'+s.id+'">'
      +   '<strong style="display:flex;align-items:center;gap:6px">'+esc(s.name||"이름 없음")
      +     (s.sample?'<span class="samplebadge">예시</span>':'')+'</strong>'
      +   '<span style="display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px">'
      +     esc(s.klass||"클래스 미지정")+' · 과목 '+subs+'개</span></button>'
      + '<button type="button" class="btn btn-sm" data-newfor="'+s.id+'">'+monthLabel()+' 작성</button>'
      + '</div>';
  }).join("");

  var list = reports.map(function(r){
    var s = attStats(r);
    return '<button type="button" class="rowcard" data-open="'+r.id+'">'
      + '<span class="avatar">'+esc((r.student.name||"?").slice(0,1))+'</span>'
      + '<span class="meta"><strong>'+esc(r.student.name||"이름 없음")
      +   (r.sample?'<span class="samplebadge">예시</span>':'')+'</strong>'
      + '<span>'+r.y+'년 '+r.m+'월 · '+esc(r.student.klass||"반 미지정")
      +   (r.teacher ? ' · '+esc(r.teacher)+' 트레이너' : '')+'</span></span>'
      + '<span class="pct">'+s.rate+'%</span></button>';
  }).join("");

  document.getElementById("app").innerHTML =
    '<div class="hero">'+lockup(academy,52)
  +   '<h1>'+esc(academy.name)+' 월간 학습 리포트</h1>'
  +   '<p>한 달간의 출결과 실력을 정리해 학부모님께 보냅니다. 완성한 리포트는 링크 하나로 카카오톡에 전달되고, 학부모님은 가입이나 설치 없이 바로 열어보실 수 있습니다.</p>'
  +   accountStrip()
  + '</div>'
  + '<div class="section">'
  +   '<div class="section-head"><h2>학생 명단</h2><span class="spacer"></span>'
  +     '<span class="dim" style="font-size:12.5px">'+students.length+'명</span></div>'
  +   (slist ? '<div class="rowlist">'+slist+'</div>'
          : '<div class="empty">학생을 등록해 두면 매달 리포트를 한 번에 만들 수 있습니다.</div>')
  +   '<button type="button" class="btn btn-block" style="margin-top:10px" data-act="newstudent">＋ 학생 등록</button>'
  + '</div>'
  + '<div class="section">'

var currentLink = "";

function siteBase(){
  var b = String(academy.site||"").trim().replace(/[#?].*$/,"").replace(/\/+$/,"");
  if(b && !/^https?:\/\//i.test(b)) b = "https://" + b;
  if(!b) b = location.origin + location.pathname.replace(/\/+$/,"");
  return b;
}
function shortId(r){
  return String(r.id||"").replace(/-/g,"").slice(0,10);
}
function setLink(u){
  currentLink = u;
  var box = document.getElementById("linkbox");
  if(box) box.textContent = u;
}
function pushShare(r){
  if(!cloudOn || !SB || !shortId(r)) return Promise.resolve(false);
  return SB.from("shares").upsert({id:shortId(r), payload:packPayload(r)})
    .then(function(res){ return !res || !res.error; }, function(){ return false; });
}
function longLink(r, base){
  encodeReport(r).then(function(frag){ setLink(base + "/#" + frag); },
    function(){
      var box = document.getElementById("linkbox");
      if(box) box.textContent = "링크를 만들지 못했습니다. 다시 시도해 주세요.";
    });
}
function buildLink(r){
  currentLink = "";
  var base = siteBase();
  if(cloudOn){
    pushShare(r).then(function(ok){
      if(ok) setLink(base + "/?s=" + shortId(r));
      else longLink(r, base);
    });
  } else {
    longLink(r, base);
  }
}

function shareIdFromUrl(){
  var m = /[?&]s=([A-Za-z0-9_-]{4,64})/.exec(location.search || "");
  return m ? m[1] : null;
}
function loadShare(id){
  return fetch(SB_URL + "/rest/v1/shares?select=payload&id=eq." + encodeURIComponent(id),
      {headers:{apikey:SB_KEY}})
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(rows){
      if(rows && rows.length && rows[0].payload) return unpackPayload(rows[0].payload);
      return null;
    })
    .catch(function(){ return null; });
}
var toastTimer;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 2400);
}
function copyLink(){
  if(!currentLink) return toast("링크를 만드는 중입니다");
  function done(){ toast("링크를 복사했습니다. 카톡에 붙여넣으세요"); }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = currentLink; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }
    catch(e){ toast("복사하지 못했습니다. 링크를 직접 선택해 주세요"); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(currentLink).then(done, fallback);
  } else fallback();
}

    teacher:r.teacher||"", y:r.year, m:r.month, greeting:r.greeting||"",
    att:r.att||{}, skills:r.skills||[], blocks:r.blocks||[]};
}

}

function initCloud(){
  if(!window.supabase || !SB_URL) return Promise.resolve();
  try{
    SB = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
  }catch(e){ SB = null; return Promise.resolve(); }
  return SB.auth.getSession().then(function(res){
    var s = (res && res.data) ? res.data.session : null;
    if(!s) return;
    sbUser = s.user;
    return afterLogin();
  }).catch(function(){ SB = null; });
}

function afterLogin(){
  return SB.from("profiles").select("name").eq("id", sbUser.id).maybeSingle()
    .then(function(p){ sbName = (p && p.data && p.data.name) ? p.data.name : ""; })
    .catch(function(){})
    .then(pullAll);
}

function pullAll(){
  return Promise.all([
    SB.from("academy").select("*").eq("id",1).maybeSingle(),
    SB.from("students").select("*").order("name"),
    SB.from("reports").select("*").order("year",{ascending:false}).order("month",{ascending:false})
  ]).then(function(res){
    var a = res[0], s = res[1], r = res[2];
    var err = a.error || s.error || r.error;
    if(err){ cloudOn = false; toast("자료를 불러오지 못했습니다: " + err.message); return; }
    if(a.data){
      var row = {};
      Object.keys(a.data).forEach(function(k){ if(k !== "id" && a.data[k] !== null) row[k] = a.data[k]; });
      academy = Object.assign(defaultAcademy(), row);
    }
    students = (s.data || []).map(rowToStudent);
    reports  = (r.data || []).map(rowToReport);
    cloudOn = true;
  });
}

function sched(){ if(!cloudOn) return; setSync("saving"); clearTimeout(flushT); flushT = setTimeout(flush, 900); }
function markA(){ if(cloudOn){ dirty.a = true; sched(); } }
function markS(id){ if(cloudOn && id){ dirty.s[id] = 1; sched(); } }
function markR(id){ if(cloudOn && id){ dirty.r[id] = 1; sched(); } }

function flush(){
  if(!cloudOn || !SB) return;
  var jobs = [];
  if(dirty.a){ dirty.a = false; jobs.push(SB.from("academy").update(academyRow()).eq("id",1)); }
  Object.keys(dirty.s).forEach(function(id){
    delete dirty.s[id];
    var s = pick(students, id);
    if(s) jobs.push(SB.from("students").upsert(studentRow(s)));
  });
  Object.keys(dirty.r).forEach(function(id){
    delete dirty.r[id];
    var r = null;
    for(var i=0;i<reports.length;i++) if(reports[i].id === id) r = reports[i];
    if(r){
      jobs.push(SB.from("reports").upsert(reportRow(r)));
      if(shortId(r)) jobs.push(SB.from("shares").upsert({id:shortId(r), payload:packPayload(r)}));
    }
  });
  if(!jobs.length){ setSync("saved"); return; }
  Promise.all(jobs).then(function(res){
    var bad = res.filter(function(x){ return x && x.error; })[0];
    if(bad){ setSync("error"); toast("저장 실패: " + bad.error.message); }
    else setSync("saved");
  }, function(){ setSync("error"); toast("저장 실패 — 연결을 확인해 주세요"); });
}
function cloudDelete(table, id, quiet){
  if(!cloudOn || !SB || !id) return;
  SB.from(table).delete().eq("id", id).select("id").then(function(res){
    if(res && res.error) toast("서버에서 지우지 못했습니다: " + res.error.message);
    else if(!quiet && (!res || !res.data || !res.data.length))
      toast("서버에서 지워지지 않았습니다. 권한을 확인해 주세요.");
  }, function(){ toast("연결에 실패해 서버에서 지워지지 않았습니다."); });
}
function setSync(s){
  syncState = s;
  var el = document.getElementById("syncdot");
  if(el) el.textContent = syncLabel();
}
function syncLabel(){
  if(syncState === "saving") return "저장 중…";
  if(syncState === "error")  return "저장 실패";
  return "저장됨";
}

function readAuth(){
  var e = document.getElementById("auEmail"), p = document.getElementById("auPass"), n = document.getElementById("auName");
  state.auEmail = e ? e.value.trim() : "";
  state.auName  = n ? n.value.trim() : (state.auName||"");
  return {email:state.auEmail, pass:p ? p.value : ""};
}
function authFail(msg){ state.authMsg = msg; state.authOk = false; render(); }

function doLogin(){
  var v = readAuth();
  if(!v.email || !v.pass) return authFail("이메일과 비밀번호를 입력해 주세요.");
  if(!SB) return authFail("서버에 연결할 수 없습니다.");
  state.authMsg = "로그인하는 중…"; state.authOk = true; render();
  SB.auth.signInWithPassword({email:v.email, password:v.pass}).then(function(res){
    if(res.error){
      var m = res.error.message || "";
      if(/Invalid login/i.test(m)) return authFail("이메일 또는 비밀번호가 맞지 않습니다.");
      if(/not confirmed/i.test(m)) return authFail("이메일 인증을 먼저 완료해 주세요. 받은 편지함을 확인하세요.");
      return authFail(m);
    }
    sbUser = res.data.user;
    state.authMsg = ""; state.screen = "home";
    try{ localStorage.removeItem(LS_SKIP); }catch(e){}
    afterLogin().then(function(){ render(); window.scrollTo(0,0); });
  }, function(){ authFail("연결에 실패했습니다. 잠시 후 다시 시도해 주세요."); });
}

function doSignup(){
  var v = readAuth();
  if(!state.auName) return authFail("이름을 입력해 주세요.");
  if(!v.email || v.pass.length < 6) return authFail("이메일과 6자 이상의 비밀번호를 입력해 주세요.");
  if(!SB) return authFail("서버에 연결할 수 없습니다.");
  state.authMsg = "계정을 만드는 중…"; state.authOk = true; render();
  SB.auth.signUp({email:v.email, password:v.pass, options:{data:{name:state.auName}}}).then(function(res){
    if(res.error){
      var m = res.error.message || "";
      if(/already registered|already exists/i.test(m)) return authFail("이미 가입된 이메일입니다. 로그인해 주세요.");
      return authFail(m);
    }
    if(res.data.session){
      sbUser = res.data.user;
      state.authMsg = ""; state.screen = "home";
      try{ localStorage.removeItem(LS_SKIP); }catch(e){}
      afterLogin().then(function(){ render(); window.scrollTo(0,0); });
    }else{
      state.authMode = "login";
      state.authMsg = "가입 확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인해 주세요.";
      state.authOk = true; render();
    }
  }, function(){ authFail("연결에 실패했습니다. 잠시 후 다시 시도해 주세요."); });
}

function doLogout(){
  if(!SB) return;
  SB.auth.signOut().then(function(){
    sbUser = null; sbName = ""; cloudOn = false;
    reports = []; students = []; academy = defaultAcademy();
    try{ localStorage.removeItem(LS_R); localStorage.removeItem(LS_S); }catch(e){}
    loadLocal();
    state.screen = "login"; state.authMsg = ""; state.id = null; state.sid = null;
    render(); window.scrollTo(0,0);
  });
}

function accountStrip(){
  if(cloudOn){
    return '<div class="strip ok"><span class="sdot"></span>'
      + '<span style="flex:1">'+esc(sbName || (sbUser && sbUser.email) || "트레이너")
      + '님으로 로그인됨 · 모든 기기에서 동기화</span>'
      + '<button type="button" class="linkbtn" data-act="logout">로그아웃</button></div>';
  }
  if(SB){
    return '<div class="strip warn"><span style="flex:1">이 기기에만 저장되고 있습니다. 다른 기기에서는 보이지 않습니다.</span>'
      + '<button type="button" class="btn btn-sm" data-act="gologin">로그인</button></div>';
  }
  return '';
}

/* ---------- 이벤트 ---------- */
function findReport(){ for(var i=0;i<reports.length;i++) if(reports[i].id===state.id) return reports[i]; return null; }
function pick(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function idx(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return i; return -1; }
function touch(){ var r=findReport(); if(r) delete r.sample; saveLocal(); markR(state.id); }
function touchS(){ var s=pick(students, state.sid); if(s) delete s.sample; saveLocal(); markS(state.sid); }

document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-act],[data-open],[data-day],[data-skill],[data-skilldel],[data-addtype],[data-bup],[data-bdown],[data-bdel],[data-qty],[data-addskillname],[data-addlesson],[data-student],[data-newfor],[data-togglesub]");
  if(!t) return;
  var r = findReport(), i;

  if(t.dataset.open){ state.id=t.dataset.open; state.screen="edit"; state.addOpen=false; render(); window.scrollTo(0,0); return; }

  if(t.dataset.student){ state.sid=t.dataset.student; state.screen="student"; render(); window.scrollTo(0,0); return; }
  if(t.dataset.newfor){
    var st = pick(students, t.dataset.newfor);
    if(st) createReportFor(st);
    return;
  }
  if(t.dataset.togglesub){
    var s2 = pick(students, state.sid);
    if(s2){
      s2.subjects = s2.subjects || [];
      var k = s2.subjects.indexOf(t.dataset.togglesub);
      if(k>=0) s2.subjects.splice(k,1); else s2.subjects.push(t.dataset.togglesub);
      delete s2.sample; saveLocal(); markS(s2.id); render();
    }
    return;
  }

  if(r){
    if(t.dataset.day){
      var d=t.dataset.day, next=CYCLE[(CYCLE.indexOf(r.att[d]||"")+1)%CYCLE.length];
      if(next) r.att[d]=next; else delete r.att[d];
      touch(); return render();
    }
    if(t.dataset.skill){
      var sk = pick(r.skills, t.dataset.skill);
      if(sk){ sk.level = +t.dataset.lv; touch(); render(); }
      return;
    }
    if(t.dataset.addskillname){
      r.skills.push({id:uid(), name:t.dataset.addskillname, level:3});
      touch(); return render();
    }
    if(t.dataset.addlesson){
      r.blocks.push({id:uid(), type:"lesson", title:t.dataset.addlesson, text:""});
      touch(); return render();
    }
    if(t.dataset.skilldel){
      r.skills = r.skills.filter(function(x){ return x.id!==t.dataset.skilldel; });
      touch(); return render();
    }
    if(t.dataset.addtype){
      r.blocks.push({id:uid(), type:t.dataset.addtype, title:"", text:""});
      state.addOpen=false; touch(); return render();
    }
    if(t.dataset.bup){
      i = idx(r.blocks, t.dataset.bup);
      if(i>0){ var a=r.blocks[i-1]; r.blocks[i-1]=r.blocks[i]; r.blocks[i]=a; }
      touch(); return render();
    }
    if(t.dataset.bdown){
      i = idx(r.blocks, t.dataset.bdown);
      if(i>-1 && i<r.blocks.length-1){ var b=r.blocks[i+1]; r.blocks[i+1]=r.blocks[i]; r.blocks[i]=b; }
      touch(); return render();
    }
    if(t.dataset.bdel){
      r.blocks = r.blocks.filter(function(x){ return x.id!==t.dataset.bdel; });
      touch(); return render();
    }
  }
  if(t.dataset.qty){
    state.qty = Math.min(8, Math.max(1, state.qty + (+t.dataset.qty)));
    return render();
  }

  switch(t.dataset.act){
    case "new": createReportFor(null); break;
    case "newstudent": {
      var ns = {id:uid(), name:"", klass:"", subjects:(academy.subjects||[]).slice()};
      students.push(ns); saveLocal(); markS(ns.id);
      state.sid = ns.id; state.screen = "student";
      render(); window.scrollTo(0,0);
      var sf = document.querySelector('[data-sf="name"]'); if(sf) sf.focus();
      break;
    }
    case "addsub": {
      var box = document.getElementById("subnew");
      var s3 = pick(students, state.sid);
      var name = box ? box.value.trim() : "";
      if(!name || !s3) break;
      s3.subjects = s3.subjects || [];
      if(s3.subjects.indexOf(name) < 0) s3.subjects.push(name);
      if((academy.subjects||[]).indexOf(name) < 0){ academy.subjects.push(name); markA(); }
      delete s3.sample; saveLocal(); markS(s3.id); render();
      break;
    }
    case "delstudent": {
      var s4 = pick(students, state.sid);
      if(s4 && confirm((s4.name||"이 학생")+" 님을 명단에서 지울까요? 작성한 리포트는 그대로 남습니다.")){
        students = students.filter(function(x){ return x.id !== s4.id; });
        delete dirty.s[s4.id];
        saveLocal(); cloudDelete("students", s4.id);
        state.screen="home"; render(); window.scrollTo(0,0);
      }
      break;
    }
    case "home": state.screen="home"; render(); window.scrollTo(0,0); break;
    case "back": state.screen="edit"; render(); window.scrollTo(0,0); break;
    case "preview": state.screen="preview"; render(); window.scrollTo(0,0); break;
    case "toggleadd": state.addOpen=!state.addOpen; render(); break;
    case "addskill": if(r){ r.skills.push({id:uid(), name:"", level:3}); touch(); render(); } break;
    case "bulk": if(r){ for(var n=0;n<state.qty;n++) r.blocks.push({id:uid(), type:"lesson", title:"", text:""}); touch(); render(); } break;
    case "del": if(r && confirm((r.student.name||"이")+" 리포트를 삭제할까요?")){
        var gone = r.id, sid = shortId(r);
        reports = reports.filter(function(x){ return x.id!==gone; });
        delete dirty.r[gone];
        saveLocal();
        cloudDelete("reports", gone);
        cloudDelete("shares", sid, true);
        state.screen="home"; render();
      } break;
    case "dologin": doLogin(); break;
    case "dosignup": doSignup(); break;
    case "authswap":
      readAuth();
      state.authMode = (state.authMode === "signup") ? "login" : "signup";
      state.authMsg = ""; render();
      break;
    case "localonly":
      try{ localStorage.setItem(LS_SKIP, "1"); }catch(e){}
      state.screen = "home"; state.authMsg = ""; render(); window.scrollTo(0,0);
      break;
    case "gologin":
      state.screen = "login"; state.authMode = "login"; state.authMsg = "";
      render(); window.scrollTo(0,0);
      break;
    case "logout": if(confirm("로그아웃할까요?")) doLogout(); break;
    case "copy": copyLink(); break;
    case "share":
      if(!currentLink) { toast("링크를 만드는 중입니다"); break; }
      if(navigator.share){
        navigator.share({title:((findReport()||{student:{}}).student.name||"학생")+" 학습 리포트", url:currentLink}).catch(function(){});
      } else copyLink();
      break;
    case "print": window.print(); break;
  }
});

document.addEventListener("input", function(ev){
  var el = ev.target, r = findReport(), o;
  if(el.dataset.ac==="subjects"){
    academy.subjects = el.value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    saveLocal(); markA(); return;
  }
  if(el.dataset.ac){ academy[el.dataset.ac]=el.value; saveLocal(); markA(); renderTop(); return; }
  if(el.dataset.sf){
    var s = pick(students, state.sid);
    if(s){ s[el.dataset.sf]=el.value; touchS(); }
    return;
  }
  if(!r) return;
  if(el.dataset.st){ r.student[el.dataset.st]=el.value; touch(); return; }
  if(el.dataset.per){
    var v = parseInt(el.value,10);
    if(!isNaN(v)) r[el.dataset.per] = el.dataset.per==="m" ? Math.min(12,Math.max(1,v)) : v;
    touch(); return;
  }
  if(el.dataset.rt != null){ r.teacher=el.value; touch(); return; }
  if(el.dataset.greet != null){ r.greeting=el.value; touch(); return; }
  if(el.dataset.skillname){ o=pick(r.skills, el.dataset.skillname); if(o){ o.name=el.value; touch(); } return; }
  if(el.dataset.btitle){ o=pick(r.blocks, el.dataset.btitle); if(o){ o.title=el.value; touch(); } return; }
  if(el.dataset.btext){
    o=pick(r.blocks, el.dataset.btext); if(o){ o.text=el.value; touch(); }
    if(el.tagName==="TEXTAREA"){ el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }
    return;
  }
});

document.addEventListener("change", function(ev){
  if(ev.target.dataset && ev.target.dataset.per) render();
});

document.addEventListener("keydown", function(ev){
  if(ev.key !== "Enter" || state.screen !== "login") return;
  if(!ev.target || ev.target.tagName !== "INPUT") return;
  ev.preventDefault();
  if(state.authMode === "signup") doSignup(); else doLogin();
});

function skipLogin(){
  try{ return !!localStorage.getItem(LS_SKIP); }catch(e){ return false; }
}

loadLocal();
(function boot(){
  var sid = shareIdFromUrl();
  var open = sid ? loadShare(sid) : decodeHash(location.hash);
  open.then(function(d){
    if(d && d.report){ state.shared = d; render(); return; }
    if(sid){ state.screen = "notfound"; render(); return; }
    render();
    initCloud().then(function(){
      if(state.shared) return;
      if(cloudOn) state.screen = "home";
      else if(SB && !skipLogin()) state.screen = "login";
      render();
    });
  });
})();
window.addEventListener("hashchange", function(){
  decodeHash(location.hash).then(function(d){
    state.shared = (d && d.report) ? d : null;
    if(!state.shared) state.screen="home";
    render(); window.scrollTo(0,0);
  });
});
})();
</script>
